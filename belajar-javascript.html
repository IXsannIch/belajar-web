<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Aplikasi</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <!-- Javascript Inline -->
    <button class="btn btn-danger" onclick="alert('Kenapa tekan-tekan saya')">Klik Saya</button>

    <label for="">Masukkan nama : </label>
    <input type="text" name="nama" id="nama" class="form-control">
    <button id="kirim">Kirim</button>

    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h4>Masuk Aplikasi</h4>
                <label>Email :</label>
                <input type="email" name="email" id="email" class="form-control">
                <label>Password :</label>
                <input type="password" name="password" id="password" class="form-control">
                <button class="btn btn-primary w-100" id="login">Login</button>
            </div>
        </div>
    </div>
</body>
<!-- Javascript Internal -->
<script>
    let nama = document.getElementById("nama")
    let kirim = document.getElementById("kirim")

    kirim.addEventListener("click",function(){
        let konfirmasi = confirm("Apakah nama kamu " + nama.value)
        if (konfirmasi) {
            alert("Hallo " + nama.value)
        }
        else {
            alert("Hmmm, mencurigakan")
        }
    })
</script>

<!-- Java Script Eksternal -->
<script src="assets/js/script.js"></script>

</html>
